services:
  postgres:
    image: postgres:16
    container_name: miniflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: miniflow
      POSTGRES_USER: miniflow
      POSTGRES_PASSWORD: miniflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniflow -d miniflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

