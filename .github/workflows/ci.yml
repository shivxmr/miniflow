name: CI

# Runs the full test suite on every push to main and on pull requests.
# Render (API) and Vercel (web) deploy automatically once this is green, so a
# red run here is the signal to stop before a broken deploy ships.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: miniflow
          POSTGRES_USER: miniflow
          POSTGRES_PASSWORD: miniflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miniflow -d miniflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      # The app's startup lifespan purges expired refresh tokens against the
      # real DATABASE_URL (the "miniflow" DB), which the TestClient triggers on
      # every test. Migrate it so that startup query has a schema to hit; the
      # test fixtures manage a separate "miniflow_test" database of their own.
      - name: Migrate app database
        run: uv run alembic upgrade head

      - name: Test (pytest)
        run: uv run pytest -q

  web:
    name: Web (eslint + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm lint

      - name: Test (vitest)
        run: pnpm test

      - name: Build (next)
        run: pnpm build
